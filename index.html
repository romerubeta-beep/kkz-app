<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Қазақ тілі — учим казахский</title>
<script src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/dist/twemoji.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash">
  <div class="splash-content">
    <div class="splash-apple">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="appleGrad" cx="35%" cy="35%">
            <stop offset="0%" stop-color="#ff6b6b"/>
            <stop offset="100%" stop-color="#c81e1e"/>
          </radialGradient>
        </defs>
        <ellipse cx="50" cy="62" rx="30" ry="28" fill="url(#appleGrad)"/>
        <ellipse cx="38" cy="52" rx="7" ry="5" fill="#ffb3b3" opacity="0.75"/>
        <path d="M50 34 Q52 26 58 22" stroke="#5a3a1e" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M55 27 Q65 18 74 25 Q66 34 55 27Z" fill="#3cb371"/>
        <path d="M57 25 L70 23" stroke="#2c8055" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
      </svg>
    </div>
    <h1 class="splash-title">Қазақ тілі</h1>
    <p class="splash-subtitle">Учим казахский</p>
    <div class="splash-dots"><span></span><span></span><span></span></div>
  </div>
</div>

<div id="app"></div>

<!-- Данные и логика -->
<script src="data.js"></script>

<!-- Firebase SDK (Compat версия, работает без type="module") -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script>
  // ВСТАВЬТЕ ВАШИ РЕАЛЬНЫЕ КЛЮЧИ ИЗ FIREBASE (Project Settings -> General)
  const firebaseConfig = {
    apiKey: "AIzaSyCSGWREy_Byjp226r9omKNjGzQYjJOBVok",
    authDomain: "kkz-app.firebaseapp.com",
    projectId: "kkz-app",
    storageBucket: "kkz-app.firebasestorage.app",
    messagingSenderId: "149547975851",
    appId: "1:149547975851:web:d0f35a842f50d279fe63ee"
  };

  try {
    if (typeof firebase === 'undefined') {
      throw new Error("Firebase не загрузился. Возможно, у вас включен блокировщик рекламы (AdBlock).");
    }
    
    // Проверка, что ключи заменены
    if (firebaseConfig.apiKey === 'ВАШ_API_KEY') {
      throw new Error("Вы не заменили ключи в firebaseConfig на реальные! Зайдите в консоль Firebase -> Project Settings.");
    }

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    window.firebaseAuth = {
      auth: firebase.auth(),
      createUserWithEmailAndPassword: (auth, email, pass) => auth.createUserWithEmailAndPassword(email, pass),
      signInWithEmailAndPassword: (auth, email, pass) => auth.signInWithEmailAndPassword(email, pass),
      signOut: (auth) => auth.signOut(),
      onAuthStateChanged: (auth, callback) => auth.onAuthStateChanged(callback),
      googleProvider: new firebase.auth.GoogleAuthProvider(),
      signInWithPopup: (auth, provider) => auth.signInWithPopup(provider)
    };
  } catch (error) {
    console.error("Ошибка Firebase:", error);
    window.firebaseInitError = error.message;
  }
</script>
</body>
</html>
