<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Қазақ тілі — учим казахский</title>
<script src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/dist/twemoji.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash">
  <div class="splash-content">
    <div class="splash-apple">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="appleGrad" cx="35%" cy="35%">
            <stop offset="0%" stop-color="#ff6b6b"/>
            <stop offset="100%" stop-color="#c81e1e"/>
          </radialGradient>
        </defs>
        <ellipse cx="50" cy="62" rx="30" ry="28" fill="url(#appleGrad)"/>
        <ellipse cx="38" cy="52" rx="7" ry="5" fill="#ffb3b3" opacity="0.75"/>
        <path d="M50 34 Q52 26 58 22" stroke="#5a3a1e" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M55 27 Q65 18 74 25 Q66 34 55 27Z" fill="#3cb371"/>
        <path d="M57 25 L70 23" stroke="#2c8055" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
      </svg>
    </div>
    <h1 class="splash-title">Қазақ тілі</h1>
    <p class="splash-subtitle">Учим казахский</p>
    <div class="splash-dots"><span></span><span></span><span></span></div>
  </div>
</div>

<div id="app"></div>

<!-- Данные и логика -->
<script src="data.js"></script>

<!-- Firebase SDK (Compat версия, работает без type="module") -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script>
  // ВСТАВЬТЕ СЮДА ВАШ КОНФИГ ИЗ FIREBASE (console.firebase.google.com)
  const firebaseConfig = {
    apiKey: "ВАШ_API_KEY",
    authDomain: "ВАШ_ПРОЕКТ.firebaseapp.com",
    projectId: "ВАШ_ПРОЕКТ",
    storageBucket: "ВАШ_ПРОЕКТ.appspot.com",
    messagingSenderId: "ВАШ_SENDER_ID",
    appId: "ВАШ_APP_ID"
  };

  // Инициализация Firebase
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  // Экспортируем функции для использования в app.js
  window.firebaseAuth = {
    auth: firebase.auth(),
    createUserWithEmailAndPassword: (email, pass) => firebase.auth().createUserWithEmailAndPassword(email, pass),
    signInWithEmailAndPassword: (email, pass) => firebase.auth().signInWithEmailAndPassword(email, pass),
    signOut: () => firebase.auth().signOut(),
    onAuthStateChanged: (callback) => firebase.auth().onAuthStateChanged(callback),
    googleProvider: new firebase.auth.GoogleAuthProvider(),
    signInWithPopup: (provider) => firebase.auth().signInWithPopup(provider)
  };
</script>

<!-- Главный скрипт приложения -->
<script src="app.js"></script>
</body>
</html>
